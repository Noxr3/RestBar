name: Release

# Builds a tagged version and creates a DRAFT release for a person to read and
# publish. Nothing here publishes on its own.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  draft:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Tag must match Info.plist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match Info.plist version $version"
            exit 1
          fi
      - name: Deterministic tests
        run: bash test.sh
      - name: Build and validate
        run: |
          bash build.sh
          plutil -lint dist/RestBar.app/Contents/Info.plist
          codesign --verify --strict dist/RestBar.app
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/RestBar.app "RestBar-$TAG-arm64.zip"
          shasum -a 256 "RestBar-$TAG-arm64.zip" > "RestBar-$TAG-arm64.zip.sha256"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "RestBar-$TAG-arm64.zip" "RestBar-$TAG-arm64.zip.sha256" \
            --draft --title "RestBar $TAG" --notes "See CHANGELOG.md. This build is ad-hoc signed and not notarized, so macOS will not open a downloaded copy normally."

name: Bug report
description: Something in RestBar isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model
      placeholder: MacBook Pro 16-inch, M3 Max
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RestBar version or commit
    validations:
      required: true
  - type: textarea
    id: pmset
    attributes:
      label: Power output
      description: For sleep or Low Power Mode problems, paste the output of `pmset -g custom` and `pmset -g assertions`. Remove anything you'd rather not share.
      render: text

name: macOS build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deterministic tests
        run: bash test.sh
      - name: Build and validate
        run: |
          bash build.sh
          plutil -lint dist/RestBar.app/Contents/Info.plist
          codesign --verify --strict dist/RestBar.app
      - name: Package application
        run: ditto -c -k --sequesterRsrc --keepParent dist/RestBar.app RestBar.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RestBar
          path: RestBar.zip
          if-no-files-found: error
          retention-days: 14
